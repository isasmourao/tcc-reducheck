# Estudo de caso — Simplificação 1 do modelo de Verly et al. (2024).
#
# Rodar a partir da raiz do repositório:
#     reducheck verificar estudo_de_caso/simp1.yaml
#
# A simplificação 1 remove as células-tronco mesenquimais (Cm) e a fibrocartilagem (Mc),
# levando o sistema de 11 para 9 variáveis. A lista exata do que foi retirado está no
# cabeçalho de `modelos/verly_simp1.ant`.
#
# O relatório separa os critérios em duas abas, cada uma com a sua contagem:
#   * Trajetória (nrmse, mape, erro_estacionario): o simplificado faz o mesmo caminho nos
#     720 dias simulados?
#   * Longo prazo (equilibrio, estabilidade_local): os dois modelos param no mesmo lugar, e
#     do mesmo jeito?
# O veredito do topo junta as duas.

versao: 1

modelos:
  original: ../modelos/verly_original.xml
  simplificado: ../modelos/verly_simp1.xml

# Simulação. Tempo em DIAS (a unidade de tempo do modelo da Verly).
#   t_inicio, t_fim: início e fim da simulação, em dias (0 a 720 dias, cerca de 2 anos).
#   pontos:          número de instantes salvos entre t_inicio e t_fim, contando as duas
#                    pontas; 1000 pontos em 720 dias dão um ponto a cada ~0,72 dia.
#   tol_relativa, tol_absoluta: tolerâncias do integrador CVODE, iguais nos dois modelos.
#   nao_negativas:   se true, um valor negativo em qualquer variável interrompe com erro.
simulacao:
  t_inicio: 0          # dia inicial
  t_fim: 720           # dia final: 720 dias (cerca de 2 anos)
  pontos: 1000         # instantes salvos de 0 a 720 dias (um a cada ~0,72 dia)
  solver: cvode
  tol_relativa: 1e-8
  tol_absoluta: 1e-10
  nao_negativas: true

variaveis:
  # --- Variáveis core: o que a simplificação tem que acertar ---------------
  # Cb (osteoblastos) e Mb (massa óssea) são a saída do modelo; C1, C2 e E2 são o
  # mecanismo hormonal/inflamatório que o trabalho estuda.
  - nome: Cb
    original: Cb
    simplificado: Cb
    core: true
  - nome: Mb
    original: Mb
    simplificado: Mb
    core: true
  - nome: C1
    original: C1
    simplificado: C1
    core: true
  - nome: C2
    original: C2
    simplificado: C2
    core: true
  - nome: E2
    original: E2
    simplificado: E2
    core: true

  # --- Comparadas, mas fora dos critérios obrigatórios ---------------------
  # D e os macrófagos têm um transiente muito rápido no início (M1 e M2 começam em 0),
  # o que torna as métricas relativas pouco informativas neles.
  - nome: D
    original: D
    simplificado: D
    core: false
  - nome: Mo
    original: Mo
    simplificado: Mo
    core: false
  - nome: M1
    original: M1
    simplificado: M1
    core: false
  - nome: M2
    original: M2
    simplificado: M2
    core: false

  # --- Eliminadas pela simplificação, sem contrapartida --------------------
  - nome: Cm
    original: Cm
    simplificado: null
    core: false
  - nome: Mc
    original: Mc
    simplificado: null
    core: false

criterios:
  # --- Trajetória: o caminho nos 720 dias -----------------------------------
  - metrica: nrmse
    limite: 0.05
    variaveis: core
    obrigatorio: true
  - metrica: mape
    limite: 0.05
    variaveis: core
    obrigatorio: false
  - metrica: erro_estacionario
    limite: 0.01
    variaveis: core
    obrigatorio: true

  # --- Longo prazo: o equilíbrio e a estabilidade ----------------------------
  # D fica fora porque não é core: é a variável do modo lento, e perto do equilíbrio os
  # dois modelos ainda descem por ela.
  - metrica: equilibrio
    limite: 0.05
    variaveis: core
    obrigatorio: true
  - metrica: estabilidade_local
    obrigatorio: true

relatorio:
  formatos: [html, md, json]
  pasta: resultados/simp1/
  niveis: 3
