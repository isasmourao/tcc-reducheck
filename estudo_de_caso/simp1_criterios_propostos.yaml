# Estudo de caso — Simplificação 1 do modelo de Verly et al. (2024), critérios alternativos.
#
# Rodar a partir da raiz do repositório:
#     reducheck verificar estudo_de_caso/simp1_criterios_propostos.yaml
#
# Mesmos modelos, simulação e mapeamento de `simp1.yaml`; mudam os critérios:
#   * core = Cb, Mb, C1, C2 (E2 saiu: ver abaixo);
#   * forma da trajetória nas core: nrmse (obrigatório) e erro_l2_rel (desejável);
#   * destino em t = 720: erro_estacionario nas core (obrigatório) e nos macrófagos (desejável);
#   * longo prazo (equilibrio, estabilidade_local) rebaixado a desejável.
#
# Os limites são os mesmos de `simp1.yaml` (0,05 e 0,01), convenção do trabalho.
# Os critérios desejáveis também entram na porcentagem: rebaixar um critério muda o
# percentual mesmo quando o veredito não muda.

versao: 1

modelos:
  original: ../modelos/verly_original.xml
  simplificado: ../modelos/verly_simp1.xml

# Simulação. Tempo em DIAS (a unidade de tempo do modelo da Verly).
#   t_inicio, t_fim: início e fim da simulação, em dias (0 a 720 dias, cerca de 2 anos).
#   pontos:          número de instantes salvos entre t_inicio e t_fim, contando as duas
#                    pontas; 1000 pontos em 720 dias dão um ponto a cada ~0,72 dia.
#   tol_relativa, tol_absoluta: tolerâncias do integrador CVODE, iguais nos dois modelos.
#   nao_negativas:   se true, um valor negativo em qualquer variável interrompe com erro.
simulacao:
  t_inicio: 0          # dia inicial
  t_fim: 720           # dia final: 720 dias (cerca de 2 anos)
  pontos: 1000         # instantes salvos de 0 a 720 dias (um a cada ~0,72 dia)
  solver: cvode
  tol_relativa: 1e-8
  tol_absoluta: 1e-10
  nao_negativas: true

variaveis:
  # --- Core: o que a simplificação tem que acertar --------------------------
  - nome: Cb
    original: Cb
    simplificado: Cb
    core: true
  - nome: Mb
    original: Mb
    simplificado: Mb
    core: true
  - nome: C1
    original: C1
    simplificado: C1
    core: true
  - nome: C2
    original: C2
    simplificado: C2
    core: true

  # --- E2: fora da contagem do veredito --------------------------------------
  # A simplificação não toca em E2, então ela sempre passaria e inflaria a porcentagem.
  # Fica comparada, sem critério: o gráfico e o series.csv mostram as duas curvas.
  - nome: E2
    original: E2
    simplificado: E2
    core: false

  # --- Comparadas, fora das core ---------------------------------------------
  - nome: D
    original: D
    simplificado: D
    core: false
  - nome: Mo
    original: Mo
    simplificado: Mo
    core: false
  - nome: M1
    original: M1
    simplificado: M1
    core: false
  - nome: M2
    original: M2
    simplificado: M2
    core: false

  # --- Eliminadas pela simplificação ----------------------------------------
  - nome: Cm
    original: Cm
    simplificado: null
    core: false
  - nome: Mc
    original: Mc
    simplificado: null
    core: false

criterios:
  # --- Trajetória: forma -------------------------------------------------------
  - metrica: nrmse
    limite: 0.05
    variaveis: core
    obrigatorio: true
  # Segunda medida de forma, robusta ao zero inicial. Desejável para a mesma falha de forma
  # não reprovar duas vezes; numa série que começa em zero ela é >= nrmse.
  - metrica: erro_l2_rel
    limite: 0.05
    variaveis: core
    obrigatorio: false

  # --- Trajetória: valor final, em t = 720 dias ------------------------------
  # fracao_final padrão (0): compara só o último ponto, t = 720 dias.
  - metrica: erro_estacionario
    limite: 0.01
    variaveis: core
    obrigatorio: true
  # Macrófagos: desejável, porque não são core.
  - metrica: erro_estacionario
    limite: 0.01
    variaveis: [Mo, M1, M2]
    obrigatorio: false

  # --- Longo prazo: desejáveis ----------------------------------------------------
  # Aparecem na aba "Longo prazo", mas só geram ressalva. Em simp1.yaml são obrigatórios.
  - metrica: equilibrio
    limite: 0.05
    variaveis: core
    obrigatorio: false
  - metrica: estabilidade_local
    obrigatorio: false

relatorio:
  formatos: [html, md, json]
  pasta: resultados/simp1_criterios_propostos/
  niveis: 3
