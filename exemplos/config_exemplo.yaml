# Exemplo de configuração do reducheck, comentado. Copie este arquivo e ajuste.
#
# Rodar como está (o par de brinquedo qssa_ok, veredito esperado: aprovado):
#     reducheck verificar exemplos/config_exemplo.yaml
#
# Todos os caminhos são relativos a ESTE arquivo.
# Os campos marcados com "(ainda não suportado)" são aceitos pelo esquema, mas a biblioteca
# para com uma mensagem explícita se forem usados nesta versão.

# Versão do formato deste arquivo. Hoje só existe a 1.
versao: 1

# Os dois modelos a comparar, em SBML.
modelos:
  original: ../tests/fixtures/qssa_ok_original.xml
  simplificado: ../tests/fixtures/qssa_ok_simplified.xml

# Condições de simulação. Valem para os DOIS modelos, sempre iguais: é isso que torna as
# trajetórias comparáveis ponto a ponto.
simulacao:
  # Os tempos estão na unidade de tempo dos modelos (a do SBML): dias, minutos, etc.
  t_inicio: 0            # opcional (padrão: 0) — instante inicial
  t_fim: 40              # instante final, na unidade de tempo do modelo
  pontos: 401            # instantes salvos entre t_inicio e t_fim, contando as duas pontas
                         # (mínimo 2); aqui, um ponto a cada 0,1 unidade de tempo
  solver: cvode          # opcional (padrão: cvode; é o único disponível)
  tol_relativa: 1e-8     # opcional (padrão: 1e-8)
  tol_absoluta: 1e-10    # opcional (padrão: 1e-10)
  nao_negativas: true    # opcional (padrão: true) — variável negativa vira erro, não veredito
  # sobrescrever:        # troca valores do SBML; o bloco de um modelo vence o comum
  #   parametros:        # vale para os dois modelos
  #     k1: 0.5
  #   condicoes_iniciais:
  #     A: 2.0
  #   original:          # só no original (B não existe na dinâmica do simplificado)
  #     condicoes_iniciais:
  #       B: 0.0

# Como casar as variáveis dos dois modelos. Uma entrada por variável comparada.
variaveis:
  - nome: A              # nome usado no relatório; pode ser diferente dos dois modelos
    original: A          # nome no modelo original
    simplificado: A      # nome no modelo simplificado
    core: true           # opcional (padrão: true) — variável essencial ao propósito do modelo
  - nome: C
    original: C
    simplificado: C
  # Uma variável eliminada por QSSA vira uma regra de atribuição no modelo simplificado, e
  # pode ser comparada com a original normalmente. Aqui B é espécie no original e regra no
  # simplificado; está com 'core: false' porque a QSSA não promete acertar B no instante
  # inicial (ver tests/fixtures/README.md):
  - nome: B
    original: B
    simplificado: B
    core: false
  # Soma de variáveis do original (agregação/lumping), como na simplificação 2 da Verly,
  # que junta Mo, M1 e M2 num único M:
  # - nome: M
  #   original: [Mo, M1, M2]
  #   simplificado: M
  # Soma ponderada, quando os termos não entram em partes iguais:
  # - nome: C_total
  #   original: {C1: 1.0, C2: 0.5}
  #   simplificado: C
  # Variável que a simplificação eliminou sem deixar contrapartida nenhuma. Precisa de
  # 'core: false', porque uma variável core sem mapeamento é erro, e nenhum critério pode
  # citá-la — não há o que comparar:
  # - nome: Cm
  #   original: Cm
  #   simplificado: null
  #   core: false
  # Expressões (razões, funções, contas) NÃO são suportadas, por decisão de escopo: a
  # validação recusa 'original: C1 + C2' dizendo isso.

# Os critérios de aceitação, declarados ANTES de comparar. Cada par (critério, variável)
# conta como um item na porcentagem do veredito.
criterios:
  - metrica: nrmse       # tem que estar no registro de métricas (ver abaixo)
    limite: 0.05         # maior erro aceito; o limite é inclusivo (passa com valor == limite)
    variaveis: [A, C]    # nomes declarados acima, ou a palavra 'core' (abaixo)
    obrigatorio: true    # opcional (padrão: true); 'false' torna o critério desejável
  # As métricas disponíveis são nrmse, mape, erro_max_abs, erro_max_rel e
  # erro_estacionario (ver docs/produto.md). Algumas aceitam opções próprias em
  # 'parametros'; o relatório sempre diz o que a métrica precisou descartar.
  - metrica: erro_estacionario
    limite: 0.01         # erro relativo no fim da simulação
    variaveis: [A, C]
    obrigatorio: false   # desejável: se só ele falhar, o veredito é APROVADO COM RESSALVAS
    parametros:
      fracao_final: 0.1  # opcional (padrão: 0 — compara só os valores finais)
  # 'mape' e 'erro_max_rel' dividem pelo original, então descartam os pontos em que ele
  # passa perto de zero. Em C, que começa em zero, o erro máximo relativo fica em 0,247:
  # é a camada inicial da QSSA (ver tests/fixtures/README.md), e por isso o critério
  # abaixo está comentado — ele reprovaria este par com o limite de 0,05.
  # - metrica: erro_max_rel
  #   limite: 0.05
  #   variaveis: [A, C]
  #   parametros:
  #     epsilon: 1e-6    # opcional (padrão: 1e-6 * max|original|)
  # 'variaveis: core' seleciona de uma vez toda variável marcada com 'core: true'. Aqui
  # daria [A, C], porque B está com 'core: false':
  # - metrica: nrmse
  #   limite: 0.05
  #   variaveis: core
  # As duas análises qualitativas. Declarar o critério é o que as liga; sem
  # eles, nada de equilíbrio é calculado. 'equilibrio' compara cada variável mapeada no
  # equilíbrio e precisa de limite e de variáveis, como uma métrica; 'estabilidade_local' é
  # um item único sobre o modelo inteiro, sem limite e sem variáveis, e passa quando os dois
  # modelos recebem a mesma classificação (estável, instável ou marginal).
  # Achar o equilíbrio pode exigir integrar muito além de 't_fim'; nesse caso o relatório
  # diz em que instante ele foi alcançado. Um critério qualitativo fala do longo prazo, não da janela simulada.
  # - metrica: equilibrio
  #   limite: 0.05        # erro relativo entre os dois equilíbrios, por variável
  #   variaveis: core
  # - metrica: estabilidade_local
  #   obrigatorio: true

# Onde escrever o resultado.
relatorio:
  formatos: [html, json] # opcional (padrão: [json]); 'html', 'md' e 'json'. 'md' gera o
                         # mesmo relatório em Markdown, com os gráficos ligados em
                         # graficos/ em vez de embutidos
  pasta: resultados/     # opcional (padrão: resultados/)
  niveis: 3              # opcional (padrão: 3); 2 junta APROVADO COM RESSALVAS em APROVADO
