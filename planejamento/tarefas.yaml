      - "Gráficos também salvos como PNG em `graficos/`, com qualidade para o texto (300 dpi, rótulos legíveis)"
      - "Opção de gerar Markdown em vez de HTML"
    instrucao: |
      Implemente o relatório legível. Leia o CLAUDE.md e a seção "Output" do documento de produto (`docs/produto.md`)
