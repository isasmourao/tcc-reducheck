      Use Jinja2 para o HTML e matplotlib para os gráficos. O HTML deve ser um arquivo único (imagens
      em base64). Ordem: veredito → resumo numérico → tabela de critérios (falhas primeiro) → razões →
      avisos → gráficos → dados da execução (config, versões, data).
      Gráficos: para cada variável mapeada, um painel com original (linha contínua) e simplificado
      (tracejada) e, embaixo, o erro absoluto ao longo do tempo. Eixos com nome da variável e unidade
      de tempo do modelo. Salve também em PNG a 300 dpi.
      Não implemente o cálculo das razões detalhadas (T15); só reserve o lugar e mostre o que existir.

