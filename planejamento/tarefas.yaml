  - id: T13
    titulo: "Estudo de caso: simplificações 1 e 2 da Verly em SBML com configurações prontas"
    tipo: [código]
    marco: M2
    semana: 4
    depende: [T04, T07]
    capacidades: [C2]
    risco: true
    contexto: |
      É a prova de que a biblioteca resolve o problema real que motivou o TCC. A simplificação 1
      (remove Cm e Mc, 9 variáveis) deveria passar; a simplificação 2 (junta Mo, M1 e M2 em M,
      7 variáveis) é a falha esperada. Se o veredito da biblioteca bater com a análise do TCC I, o
      estudo de caso está validado.
    entrega: |
      O primeiro relatório real: a biblioteca verificando as simplificações do TCC I.
    aceite:
      - "`modelos/verly_simp1.ant/.xml` e `modelos/verly_simp2.ant/.xml` derivados do original conferido (T04)"
      - "Simplificação 1: sem Cm e Mc, sem o termo k3·Cm em C2 e sem o termo F1 em Cb, como no TCC I"
      - "Simplificação 2: variável M no lugar de Mo, M1 e M2 (confirmar a equação de M com a Isabella/Ana Clara)"
      - "`estudo_de_caso/simp1.yaml` e `simp2.yaml` com variáveis core e critérios definidos com a Isabella"
      - "Os dois relatórios gerados em `estudo_de_caso/resultados/`"
      - "Nota curta comparando os vereditos com os resultados do TCC I (batem? se não, por quê?)"
    instrucao: |
      Monte o estudo de caso com as simplificações do TCC I (seção 4.1 de `docs/tcc1.pdf`). Leia o
      CLAUDE.md antes.
      1. Parta de `modelos/verly_original.ant` (já conferido) e crie as duas simplificações em Antimony.
         Simplificação 1: remova Cm e Mc, seus parâmetros, o termo k3·Cm da equação de C2 e o termo F1
         da equação de Cb. Simplificação 2: além disso, substitua Mo, M1 e M2 por uma variável M. A
         equação de M não está no PDF nem no repositório TCC-bone_estradiol: PERGUNTE à Isabella onde
         está o código das simplificações do TCC I antes de inventar.
      2. Antes de definir os critérios, pergunte à Isabella quais variáveis são core. Proponha:
         nrmse ≤ 5% obrigatório nas core, mape ≤ 5% desejável, erro_estacionario ≤ 1% obrigatório.
      3. Mapeamento na simplificação 2: M ↔ [Mo, M1, M2]. Como M1 começa em 0, não use MAPE em M1
         nem em variáveis que partem de zero; o aviso da T15 deve disparar se alguém usar.
      4. Gere os dois relatórios e escreva `estudo_de_caso/NOTAS.md` comparando com o TCC I.
      Não ajuste limites para fazer a simplificação 1 passar; se ela falhar, isso é um resultado.

  - id: W04
    titulo: "Escrever os Trabalhos Relacionados"
    tipo: [escrita]
    marco: M2
    semana: 4
    depende: [W03]
    capacidades: []
    contexto: |
      É onde a banca vai procurar a novidade do trabalho. O levantamento inicial mostra que o
      ecossistema resolve partes do problema (simular, comparar simuladores, diff estrutural, gerar
      reduções), mas não a verificação integrada. O trabalho mais próximo é Frøysa et al. (2018).
    entrega: |
      Seção que posiciona a biblioteca frente ao que existe, com a lacuna explícita.
    aceite:
      - "Ferramentas: SBML Test Suite, BiVeS, Tellurium/libRoadRunner, COPASI, AutoReduce (e sbmlsim/PEtab, depois de conferidos)"
      - "Artigos: Snowden et al. 2017, Frøysa et al. 2018, Hasegawa & Duffull 2018 (os dois), Derbalah et al. 2022"
      - "Tabela comparativa: trabalho × capacidades (entrada padrão, mapeamento, métricas configuráveis, análise qualitativa, veredito com razões)"
      - "Parágrafo final com a lacuna e a contribuição deste trabalho"
      - "Toda referência conferida na fonte original"
    instrucao: |
      Ajude a Isabella a escrever os Trabalhos Relacionados. Ela escreve a versão final; você pesquisa,
      confere e rascunha.
      Base: seção "Trabalhos relacionados" e a tabela sobre Frøysa et al. em `docs/questoes-em-aberto.md`.
      1. Confira cada referência na fonte original (título, autores, ano, veículo) e marque as que não
         conseguiu conferir.
      2. Pesquise sbmlsim e PEtab e diga se mudam a lacuna.
      3. Rascunhe um parágrafo por grupo (ferramentas de simulação; comparação e teste; redução;
         avaliação de modelos reduzidos; credibilidade).
      4. Monte a tabela comparativa com colunas: entrada padronizada, mapeamento entre variáveis,
         métricas configuráveis, análise qualitativa, veredito com razões, ferramenta reutilizável.
      5. Feche com a lacuna, sem exagerar: a contribuição é de integração e engenharia, não uma métrica nova.
      Saída em LaTeX (template SBC) e entradas BibTeX para todas as referências.

# ---------------------------------------------------------------- MARCO 3
  - id: T14
    titulo: "Análise qualitativa: equilíbrio e estabilidade local nos dois modelos"
    tipo: [código]
    marco: M3
    semana: 5
    depende: [T07, T10]
    capacidades: [L1, L2, L3]
    risco: true
    contexto: |
      O TCC I promete comparar pontos de equilíbrio e estabilidade. De forma genérica, é viável achar
      UM equilíbrio (o que o sistema atinge a partir das condições iniciais dadas) e classificar sua
      estabilidade local pelos autovalores da Jacobiana. Essa limitação precisa aparecer no relatório.
    entrega: |
      O veredito passa a considerar se o simplificado mantém o comportamento de longo prazo do original, e não só as trajetórias.
    aceite:
      - "Equilíbrio de cada modelo: libRoadRunner steadyState, com plano B de integrar até estabilizar e refinar com scipy.optimize.root"
      - "Jacobiana no equilíbrio e autovalores (libRoadRunner ou diferenças finitas)"
      - "Classificação: estável, instável ou marginal (parte real ~0, com tolerância)"
      - "Critério `estabilidade_local`: passa se os dois modelos têm a mesma classificação"
      - "Critério `equilibrio`: compara as variáveis mapeadas no equilíbrio, com limite relativo"
      - "Relatório mostra os autovalores dominantes e o aviso de que só um equilíbrio foi analisado"
      - "Testes com os modelos de brinquedo (equilíbrio conhecido analiticamente)"
      - "Funciona no modelo da Verly (ou documenta por que não)"
    instrucao: |
      Implemente o módulo qualitativo. Leia o CLAUDE.md antes.
      1. `find_equilibrium(model, conditions)`: tente o steadyState do libRoadRunner; se falhar ou não
         convergir, integre até que a norma da derivada fique abaixo de uma tolerância e refine com
         scipy.optimize.root. Devolva o ponto, o método usado e o resíduo.
      2. `local_stability(model, point)`: Jacobiana completa no ponto (libRoadRunner
         getFullJacobian, ou diferenças finitas), autovalores, classificação com tolerância
         configurável para parte real ~0.
      3. Critérios `estabilidade_local` (mesma classificação) e `equilibrio` (erro relativo das
         variáveis mapeadas no equilíbrio ≤ limite).
      4. Relatório: tabela com o equilíbrio das variáveis mapeadas nos dois modelos e os três
         autovalores de maior parte real; aviso fixo: "análise de um único equilíbrio, alcançado a
         partir das condições iniciais da configuração; outros equilíbrios não foram buscados".
      Os modelos têm dimensões diferentes, então compare classificações e variáveis mapeadas, nunca
      os vetores de autovalores diretamente. Não implemente busca de múltiplos equilíbrios nem estabilidade global.

  - id: T15
    titulo: "Razões detalhadas das falhas e avisos de métrica inadequada"
    tipo: [código]
    marco: M3
    semana: 6
    depende: [T11]
    capacidades: [V3, Q6]
    contexto: |
      Um veredito sem explicação não serve para decidir o que ajustar na simplificação. A razão precisa
      dizer por quanto o critério falhou e onde, no tempo, o erro se concentra (ex.: só no transiente inicial).
    entrega: |
      Cada falha vem com um diagnóstico útil, e o usuário é avisado quando escolheu uma métrica que engana.
    aceite:
      - "Para cada item que falhou: valor, limite, excesso relativo e a janela de tempo onde está a maior parte do erro"
      - "Distinção automática entre erro no transiente e erro no estado estacionário"
      - "Aviso quando MAPE é usado em variável que chega perto de zero"
      - "Aviso quando o NRMSE é dominado por um pico isolado"
      - "Razões aparecem no JSON e no relatório, em português claro"
      - "Testes com casos construídos (erro só no início, erro só no fim)"
    instrucao: |
      Implemente o gerador de razões e os avisos de métrica. Leia o CLAUDE.md antes.
      1. Para cada item reprovado, calcule a janela de tempo que concentra 80% do erro acumulado e
         classifique como "transiente" (primeiros 20% do tempo), "estado estacionário" (últimos 20%)
         ou "ao longo da simulação".
      2. Gere uma frase por falha, no modelo: "mape em M falhou: 8,1% (limite 5%), erro concentrado
         entre t = 0 e t = 40 (transiente); no estado estacionário o erro é 0,4%."
      3. Avisos: MAPE com mais de 5% dos pontos perto de zero; NRMSE em que um único ponto responde
         por mais de 50% do erro quadrático.
      Mantenha o texto das razões em templates, não espalhado pelo código.

