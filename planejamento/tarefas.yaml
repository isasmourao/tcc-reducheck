      - "Tabela de tempo de execução: original vs. simplificação 1 vs. simplificação 2 (média de 10 execuções)"
      - "Tag v0.3.0 no repositório"
    instrucao: |
      Feche o MVP. Leia o CLAUDE.md e os critérios de pronto do documento de produto (`docs/produto.md`).
