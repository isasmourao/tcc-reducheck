         à motivação original de eficiência computacional.
      5. Crie a tag v0.3.0. Daqui em diante, só correções de bugs.

  - id: W05
    titulo: "Escrever a Metodologia: arquitetura e decisões de projeto da biblioteca"
    tipo: [escrita]
