      - "Teste que roda o exemplo do README e confirma que funciona"
      - "Uma pessoa do grupo testou seguindo só o README"
    instrucao: |
      Escreva o README em português. Leia o CLAUDE.md e o código atual antes; documente o que EXISTE,
