# ---------------------------------------------------------------- MARCO 4
  - id: W07
    titulo: "Escrever Resultados e Discussão"
    tipo: [escrita]
    marco: M4
    semana: 7
    depende: [T18, W06]
    capacidades: []
    contexto: |
      Com o MVP fechado, é hora de apresentar o que a biblioteca concluiu sobre as simplificações e
      discutir o que isso diz sobre a própria ferramenta: ela distingue a simplificação viável da falha
      esperada? As razões ajudam a entender a falha?
    entrega: |
      Seção de Resultados e Discussão com figuras, tabelas e interpretação.
    aceite:
      - "Resultado da conferência da conversão SBML"
      - "Vereditos das simplificações 1 e 2, com as tabelas de critérios e as figuras principais"
      - "Resultados da análise qualitativa (equilíbrios, estabilidade)"
      - "Tempo de execução original vs. simplificados, e o que isso significa para a integração com o modelo biomecânico"
      - "Discussão: a ferramenta separou o caso viável da falha esperada? As razões foram informativas?"
      - "Comparação com a análise manual do TCC I"
      - "Limitações do trabalho, com honestidade"
    instrucao: |
      Ajude a Isabella a escrever Resultados e Discussão. Fontes: figuras e tabelas geradas na T18,
      relatórios em `estudo_de_caso/resultados/` e `estudo_de_caso/NOTAS.md`.
      Rascunhe primeiro os resultados (o que aconteceu, com números) e depois a discussão (o que
      significa). Cada figura e tabela deve ser referenciada e comentada no texto. Na discussão,
      responda: (1) a biblioteca distinguiu a simplificação 1 da 2? (2) as razões explicam a falha da 2?
      (3) o ganho de tempo justifica a simplificação 1? (4) quais limitações afetam as conclusões
      (um único equilíbrio, um único cenário, só dois estudos de caso)?
      Não exagere conclusões a partir de um único modelo. Saída em LaTeX (template SBC).

