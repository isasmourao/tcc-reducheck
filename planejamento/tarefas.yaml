    entrega: |
      Seção de Metodologia descrevendo o produto e justificando cada decisão.
    aceite:
      - "Visão geral e diagrama do pipeline (entrada → simulação → mapeamento → métricas/qualitativo → veredito → relatório)"
      - "Formato de entrada: SBML + YAML, com um exemplo de configuração comentado"
      - "Mapeamento entre variáveis (1:1, soma, ponderada, assignment rules)"
      - "Métricas implementadas (fórmulas) e o mecanismo de extensão"
      - "Análise qualitativa e sua limitação declarada"
      - "Regra do veredito, com justificativa dos critérios obrigatórios"
      - "Ferramentas usadas (libRoadRunner, pydantic, etc.) e estratégia de testes"
      - "Cada decisão importante com uma frase de justificativa (e referência, quando houver)"
    instrucao: |
      Ajude a Isabella a escrever a Metodologia. Ela escreve a versão final; você rascunha a partir
      do código real do repositório (não do plano) e revisa.
      1. Leia o código e o CLAUDE.md e liste as decisões de projeto efetivamente implementadas.
      2. Rascunhe as subseções: visão geral, entrada, simulação, mapeamento, métricas, análise
         qualitativa, veredito, relatório, testes e reprodutibilidade.
      3. Desenhe o diagrama do pipeline em TikZ (ou gere uma figura) no mesmo estilo das demais.
      4. Para cada decisão, uma frase de justificativa (ex.: por que SBML e não CellML; por que
         obrigatórios; por que NRMSE e não RMSE puro), citando o levantamento quando couber.
      Não descreva nada que não esteja implementado. Saída em LaTeX (template SBC).

