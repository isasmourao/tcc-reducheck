# Convenção de todas as instruções para o Claude:
# o repositório tem um CLAUDE.md (criado na T02) com o contexto do projeto; cada instrução assume que ele existe.

tarefas:

# ---------------------------------------------------------------- MARCO 0
  - id: D01
    titulo: "Aprovar o escopo do MVP com a orientadora"
    tipo: [decisão]
    marco: M0
    semana: 1
    depende: []
    capacidades: []
    contexto: |
      O rumo do TCC mudou: de simplificar o modelo da Verly para construir uma biblioteca que verifica
      simplificações. O documento de produto (`docs/produto.md`) define escopo, input, output e entregas, mas nada foi
      aprovado ainda. Sem essa aprovação, qualquer ideia nova pode entrar no escopo e estourar o prazo.
    entrega: |
      Escopo congelado. A lista "entra / fica de fora" passa a ser o critério para recusar ideias novas.
    aceite:
      - "Orientadora aprovou (ou ajustou) a lista \"entra / fica de fora\" do documento de produto (`docs/produto.md`)"
      - "Decidido: estabilidade global fora do escopo (o texto do TCC I promete essa análise)"
      - "Decidido: SBML como único formato de entrada"
      - "Decidido: veredito em três níveis ou só aprovado/reprovado"
      - "Decidido: termo usado no texto (\"verificação de fidelidade\" ou \"validação\")"
      - "Obtido um exemplo do relatório do JEV (se ainda for referência)"
      - "Decisões registradas no documento de produto (`docs/produto.md`) e em `docs/questoes-em-aberto.md`"
    instrucao: |
      Prepare uma pauta de reunião de no máximo uma página para a Isabella levar à orientadora.
      Use o documento de produto (`docs/produto.md`) e o arquivo `docs/questoes-em-aberto.md`.
      Para cada decisão pendente, escreva: a pergunta, a recomendação com uma frase de justificativa
      e o impacto no prazo se a resposta for diferente da recomendada. Não reabra decisões já tomadas
      (biblioteca Python, caminho do meio). Depois da reunião, registre as respostas nos dois documentos.

  - id: T02
    titulo: "Criar o esqueleto da biblioteca com testes e CI"
    tipo: [código]
    marco: M0
    semana: 1
    depende: []
    capacidades: [F1, F2]
    contexto: |
      Todo o código será escrito com o Claude, então o repositório precisa explicar o projeto sozinho.
      O CLAUDE.md e a pasta `docs/` já existem (contexto, fluxo de trabalho com issues, convenções);
      esta tarefa cria a estrutura de código e atualiza o CLAUDE.md para refletir a estrutura real.
      A estrutura em módulos segue o pipeline do documento de produto (`docs/produto.md`): entrada → simulação → mapeamento
      → métricas / qualitativo → veredito → relatório.
    entrega: |
      Um repositório instalável onde qualquer tarefa seguinte já tem lugar certo para o código e para os testes.
    aceite:
      - "`pip install -e .[dev]` funciona num ambiente limpo com Python 3.11+"
      - "Pacote `reducheck` com os módulos vazios: config, simulation, mapping, metrics, qualitative, verdict, report, cli"
      - "`pytest` roda (com pelo menos um teste trivial) e o GitHub Actions executa os testes a cada push e PR"
      - "Dependências declaradas: libroadrunner (ou tellurium), numpy, scipy, pyyaml, pydantic, matplotlib, jinja2; ruff para lint"
      - "CLAUDE.md existente atualizado com a árvore real de pastas e os comandos de teste e lint (sem apagar o que já está lá)"
      - "README com uma linha de descrição e instrução de instalação"
    instrucao: |
      Crie o esqueleto de uma biblioteca Python chamada `reducheck` (nome provisório) neste repositório.

      Objetivo do produto: receber um modelo de EDOs original e um simplificado, ambos em SBML, mais um
      arquivo YAML de configuração, e emitir um veredito (aprovado / aprovado com ressalvas / reprovado)
      com a porcentagem de critérios atendidos e as razões.

      Faça:
      1. pyproject.toml (setuptools ou hatch), layout `src/reducheck/`, extras `[dev]` com pytest e ruff.
      2. Módulos vazios com docstring de uma linha explicando a responsabilidade de cada um:
         config (ler e validar o YAML), simulation (simular os dois modelos), mapping (casar variáveis),
         metrics (métricas plugáveis), qualitative (equilíbrio e estabilidade local),
         verdict (critérios e veredito), report (JSON, HTML e gráficos), cli (linha de comando).
      3. `tests/` com um teste trivial e `tests/fixtures/` vazio para modelos SBML de teste.
      4. GitHub Actions rodando ruff e pytest em Python 3.11 e 3.12.
      5. Atualize o CLAUDE.md existente: acrescente a árvore de pastas real e os comandos de instalação,
         teste e lint. Não remova as seções que já existem (contexto, fluxo com issues, convenções,
         fora do escopo).
      Siga as convenções do CLAUDE.md.
      Não implemente lógica ainda. Mostre a árvore final de arquivos e rode os testes.

  - id: T03
    titulo: "Criar modelos de brinquedo em SBML com veredito conhecido"
    tipo: [código]
    marco: M0
    semana: 1
    depende: [T02]
    capacidades: [F3]
    contexto: |
      Para saber se a biblioteca acerta, é preciso testá-la em modelos pequenos onde a resposta certa é
      conhecida de antemão. Esses modelos também viram o exemplo do README e cenários de teste para
      cada capacidade (mapeamento 1:1, soma, QSSA, falha de simulação).
    entrega: |
      Um banco de casos de teste: para cada par original/simplificado sabemos se deve passar ou falhar e por quê.
    aceite:
      - "Pelo menos 3 pares original/simplificado em `tests/fixtures/`, escritos em Antimony e exportados para SBML"
      - "Um par que DEVE passar (ex.: redução por QSSA com separação de escala de tempo forte)"
      - "Um par que DEVE falhar (ex.: a mesma redução sem separação de escala)"
      - "Um par com agregação (variável do simplificado = soma de duas do original)"
      - "Um arquivo `tests/fixtures/README.md` explica cada par, o veredito esperado e o porquê"
      - "Um teste verifica que todos os SBML carregam e simulam no libRoadRunner"
    instrucao: |
      Crie modelos de brinquedo em SBML para testar a biblioteca. Leia o CLAUDE.md antes.
      Escreva cada modelo em Antimony (via tellurium ou antimony) e exporte para SBML; mantenha os
      dois arquivos (.ant e .xml) em `tests/fixtures/`.
      Casos mínimos (2 a 4 variáveis cada):
      1. Cadeia A → B → C com B rápido; simplificado elimina B por QSSA (B vira assignment rule).
         Deve PASSAR com NRMSE < 5% nas variáveis A e C.
      2. O mesmo, mas com B lento; a mesma redução deve FALHAR.
      3. Duas variáveis X1 e X2 com dinâmica parecida; simplificado usa X = X1 + X2. Deve PASSAR.
      Calcule e anote no README dos fixtures o NRMSE real de cada par, para que os testes futuros usem
      valores concretos. Escolha parâmetros que deixem as respostas longe do limite de 5% (sem casos
      ambíguos). Adicione um teste que carrega e simula todos os modelos.

  - id: T04
    titulo: "Converter o modelo da Verly para SBML e conferir contra o código atual"
    tipo: [código]
    marco: M0
    semana: 1
    depende: [T02]
    capacidades: [C1]
    risco: true
    contexto: |
      É o item mais arriscado do TCC: todo o estudo de caso depende dele. O modelo tem 11 variáveis
      (D, Mo, M1, M2, C1, C2, Cm, Cb, Mc, Mb, E2) e hoje existe como código Python com scipy
      (LSODA, 720 dias, 1000 pontos). Se o SBML tiver um erro de digitação, todos os resultados ficam errados.
      O código original está em https://github.com/isasmourao/TCC-bone_estradiol, arquivo
      `original_Model/bone_estradiol.py` (função `bonerepair`). Atenção: no código a variável é `Mo`
      (letra o), não `M0`, e M1 começa em 0 (o que importa para o MAPE).
      PRÉ-REQUISITO: confirmar com a Isabella se essa é a versão do modelo usada no TCC I.
    entrega: |
      O modelo da Verly em formato padrão, com prova de que reproduz o código original.
    aceite:
      - "`original_Model/bone_estradiol.py` do repositório TCC-bone_estradiol copiado para `referencia/` (sem alterações), com a origem anotada"
      - "Modelo escrito em Antimony em `modelos/verly_original.ant` e exportado para `modelos/verly_original.xml`"
      - "Todos os parâmetros e condições iniciais com o mesmo nome e valor do código original"
      - "Script `referencia/comparar_sbml.py` simula os dois (720 dias, 1000 pontos) e mostra o erro relativo máximo por variável"
      - "Erro relativo máximo < 1e-4 em todas as 11 variáveis (ou diferença explicada e aceita pela Isabella)"
      - "Gráfico sobreposto das 11 variáveis salvo em `referencia/comparacao_sbml.png`"
    instrucao: |
      Converta o modelo da Verly et al. (2024) para SBML. Leia o CLAUDE.md antes.
      0. Copie `original_Model/bone_estradiol.py` de https://github.com/isasmourao/TCC-bone_estradiol
         para `referencia/`, sem alterar, anotando o commit de origem. Pergunte à Isabella se é a versão
         usada no TCC I; se houver outra, use a que ela indicar.
      1. Leia o código original e liste as 11 variáveis de estado, todos os parâmetros com valores e
         unidades, e as condições iniciais. Me mostre essa lista antes de escrever o modelo.
      2. Escreva o modelo em Antimony (`modelos/verly_original.ant`), uma equação por variável, usando
         EXATAMENTE os mesmos nomes do código original. Não simplifique nem "corrija" nenhum termo;
         se algo parecer errado no original, anote numa lista de dúvidas para a Isabella e reproduza
         como está.
      3. Exporte para SBML (`modelos/verly_original.xml`) e valide com libsbml.
      4. Escreva `referencia/comparar_sbml.py`: simula o original com scipy (LSODA, como no código) e o
         SBML com libRoadRunner (CVODE, rtol 1e-10, atol 1e-12), de 0 a 720 dias com 1000 pontos, e
         imprime o erro relativo máximo por variável.
      5. Se alguma variável passar de 1e-4, investigue termo a termo antes de concluir; não aumente
         tolerâncias para esconder diferenças.
      Entregue a tabela de erros, o gráfico e a lista de dúvidas.

  - id: W01
    titulo: "Reescrever título, objetivos e resumo provisório com o novo foco"
    tipo: [escrita]
    marco: M0
    semana: 1
    depende: [D01]
    capacidades: []
    contexto: |
      O texto do TCC I fala em "propor e validar simplificações". O foco agora é uma biblioteca que
      verifica simplificações. Título e objetivos são a âncora de todo o resto do texto e da conversa
      com a banca; se ficarem para o fim, o texto inteiro fica desalinhado.
    entrega: |
      Título, objetivo geral, objetivos específicos e um resumo provisório alinhados ao produto.
    aceite:
      - "Novo título (2 ou 3 opções levadas à orientadora, uma escolhida)"
      - "Objetivo geral em uma frase, focado na biblioteca"
      - "3 a 5 objetivos específicos, cada um ligado a uma entrega verificável do MVP"
      - "Resumo provisório de até 150 palavras"
      - "Termo \"verificação\" vs. \"validação\" usado de forma consistente, conforme decidido em D01"
    instrucao: |
      Ajude a Isabella a reescrever título, objetivos e resumo do TCC. Ela escreve; você propõe e revisa.
      Contexto: o TCC I (`docs/tcc1.pdf`) propunha simplificar o modelo de Verly et al. (2024).
      O novo foco está no documento de produto (`docs/produto.md`): uma biblioteca Python que verifica se um modelo
      simplificado é fiel ao original, com métricas escolhidas pelo usuário, análise de equilíbrio e
      estabilidade local, e relatório com veredito e razões. As simplificações do TCC I viram estudo de caso.
      1. Proponha 3 títulos (um mais técnico, um mais aplicado, um equilibrado).
      2. Proponha objetivo geral e 3 a 5 específicos; cada específico deve corresponder a algo que o
         MVP entrega de fato (não prometa estabilidade global nem incerteza de parâmetros).
      3. Proponha um resumo de até 150 palavras com: problema, proposta, estudo de caso, resultado
         esperado. Marque com [RESULTADO] os trechos que dependem de resultados ainda não obtidos.
      Escreva em português acadêmico, sem adjetivos vazios. Saída em LaTeX compatível com o template SBC do TCC I.

# ---------------------------------------------------------------- MARCO 1
  - id: T05
    titulo: "Pipeline ponta a ponta mínimo: do YAML ao veredito em JSON"
    tipo: [código]
    marco: M1
    semana: 2
    depende: [T02, T03]
    capacidades: [E1, E3, S1, M1, Q1, V1, R1, U1]
    contexto: |
      É a primeira versão que funciona de ponta a ponta. Cada módulo faz o mínimo, mas o fluxo completo
      existe: a partir daqui, cada tarefa seguinte só enriquece uma etapa, sem mudar a arquitetura.
      É também a primeira coisa demonstrável para a orientadora.
    entrega: |
      `reducheck.verificar("config.yaml")` devolve um resultado com aprovado/reprovado e um JSON,
      acertando os modelos de brinquedo.
    aceite:
      - "Lê um YAML com: modelos (caminhos), simulação (t_inicio, t_fim, pontos), variáveis (1:1) e critérios (só nrmse)"
      - "Carrega os dois SBML e simula ambos nas mesmas condições com libRoadRunner"
      - "Mapeamento 1:1, com mesmo nome ou renomeado"
      - "Métrica NRMSE (RMSE dividido pela amplitude da trajetória original) por variável"
      - "Cada critério vira passou/falhou; o modelo é aprovado se todos passarem"
      - "Resultado salvo em `resultado.json` com valor, limite e resultado de cada critério"
      - "Testes: par de brinquedo 1 aprovado, par 2 reprovado, sem intervenção manual"
      - "Formato do YAML igual ao do documento de produto (`docs/produto.md`) (seção Input), nos campos já suportados"
    instrucao: |
      Implemente o fluxo mínimo ponta a ponta da biblioteca. Leia o CLAUDE.md e a seção "Input" e
      "Output" do documento de produto (`docs/produto.md`) antes.
      Objetivo: `resultado = reducheck.verificar("config.yaml")` funciona para os pares 1 e 2 de
      `tests/fixtures/`.
      Faça o mínimo em cada módulo, com interfaces pensadas para crescer:
      - config: dataclasses/pydantic para o YAML (só os campos desta tarefa; sem validação elaborada ainda).
      - simulation: função que recebe um caminho SBML e as condições e devolve tempo + matriz de estados
        (nomes das colunas incluídos). Os dois modelos DEVEM usar o mesmo vetor de tempo e o mesmo solver.
      - mapping: para cada variável declarada, extrai a série do original e do simplificado (1:1).
      - metrics: função `nrmse(orig, simp)`; defina uma interface comum (assinatura e retorno) que as
        próximas métricas vão seguir.
      - verdict: aplica limite a cada par (critério, variável) e devolve uma lista de resultados + aprovado.
      - report: grava `resultado.json`.
      Escreva os testes primeiro para os pares de brinquedo. Não implemente soma, outras métricas,
      três níveis de veredito nem relatório HTML: são tarefas separadas.

  - id: W02
    titulo: "Escrever a Introdução"
    tipo: [escrita]
    marco: M1
    semana: 2
    depende: [W01]
    capacidades: []
    contexto: |
      A introdução apresenta o problema (validar simplificações hoje é ad hoc e não reprodutível), a
      proposta (biblioteca de verificação) e o estudo de caso (modelo de remodelação óssea na menopausa).
      Parte do texto do TCC I pode ser reaproveitada como contexto biológico.
    entrega: |
      Seção de Introdução completa, pronta para revisão da orientadora.
    aceite:
      - "Contexto: modelos de EDOs em biologia crescem e precisam ser simplificados (reaproveitar TCC I)"
      - "Problema: falta de um processo padronizado e reprodutível para verificar simplificações"
      - "Proposta e contribuições listadas (3 a 4), coerentes com os objetivos de W01"
      - "Parágrafo final com a organização do texto"
      - "Toda afirmação factual com referência; nenhuma referência inventada"
      - "Entre 1,5 e 2,5 páginas no template"
    instrucao: |
      Ajude a Isabella a escrever a Introdução do TCC. Ela escreve a versão final; você produz um
      rascunho estruturado e revisa.
      Fontes: introdução do TCC I (`docs/tcc1.pdf`), documento de produto (`docs/produto.md`), `docs/questoes-em-aberto.md`
      e os objetivos definidos em W01.
      Estrutura: (1) contexto biológico e modelagem por EDOs (reaproveite o TCC I, encurtando);
      (2) por que simplificar (integração ao modelo biomecânico, calibração, análise);
      (3) o problema: verificar se a simplificação é fiel é feito de forma ad hoc, com métricas e limites
      que variam entre trabalhos; (4) a proposta e as contribuições; (5) organização do texto.
      Use apenas referências que já estão no TCC I ou no levantamento do projeto; onde faltar fonte,
      escreva [CITAR: o que precisa ser sustentado] em vez de inventar. Saída em LaTeX (template SBC).

  - id: W03
    titulo: "Escrever a Fundamentação Teórica"
    tipo: [escrita]
    marco: M2
    semana: 3
    depende: [W01]
    capacidades: []
    contexto: |
      A banca precisa dos conceitos para entender a metodologia: redução de modelos, verificação
      vs. validação, métricas de erro e suas armadilhas, estabilidade local e padrões como SBML.
      A parte biológica do TCC I continua, mas encurtada, porque o foco agora é computacional.
    entrega: |
      Seção de Fundamentação Teórica completa.
    aceite:
      - "Remodelação óssea e menopausa: versão enxuta do TCC I (máx. 1 página)"
      - "Redução de modelos de EDOs: eliminação de variáveis, lumping e QSSA (Snowden et al. 2017a,b)"
      - "Verificação vs. validação de modelos computacionais, com definição do termo adotado"
      - "Métricas de erro: RMSE, NRMSE, MAPE e erro máximo, com equações e limitações (ex.: MAPE perto de zero)"
      - "Pontos de equilíbrio e estabilidade local (Jacobiana e autovalores)"
      - "Padrões de representação de modelos: SBML (e menção a CellML e SED-ML)"
      - "Equações numeradas e notação consistente em toda a seção"
    instrucao: |
      Ajude a Isabella a escrever a Fundamentação Teórica. Ela escreve a versão final; você produz
      rascunho e revisa.
      Subseções: (1) remodelação óssea e menopausa (condensar a 2.1–2.2 do TCC I); (2) redução de modelos
      de EDOs; (3) verificação e validação (use ASME V&V 40 e Erdemir et al. 2020 do levantamento);
      (4) métricas de erro com equações em LaTeX e uma frase sobre quando cada uma falha;
      (5) equilíbrio e estabilidade local: definição, linearização, critério dos autovalores, e por que
      a estabilidade global não é tratada; (6) SBML e o ecossistema COMBINE.
      Use as referências do levantamento em `docs/questoes-em-aberto.md`. Antes de citar qualquer uma,
      confira a fonte original (título, autores, ano). Onde não houver fonte confirmada, use [CITAR: ...].
      Saída em LaTeX (template SBC).

# ---------------------------------------------------------------- MARCO 2
  - id: T06
    titulo: "Validar a configuração com mensagens de erro claras"
    tipo: [código]
    marco: M2
    semana: 3
    depende: [T05]
    capacidades: [E2, E4]
    contexto: |
      O público são pesquisadores que não vão ler o código. Se o YAML tiver um erro, a mensagem
      precisa dizer o que está errado e onde, antes de gastar tempo simulando.
    entrega: |
      Configurações inválidas são recusadas na hora, com uma mensagem que resolve o problema.
    aceite:
      - "Esquema completo do YAML (seção Input do documento de produto (`docs/produto.md`)) validado com pydantic"
      - "Erro claro para: arquivo inexistente, SBML inválido, variável que não existe no modelo, variável core sem mapeamento, métrica desconhecida, limite negativo"
      - "Toda mensagem diz o campo (ex.: `variaveis[2].original`) e sugere a correção quando possível (ex.: nomes parecidos)"
      - "Um teste por tipo de erro"
    instrucao: |
      Implemente a validação completa da configuração. Leia o CLAUDE.md e a seção "Input" do
      documento de produto (`docs/produto.md`).
      Use pydantic para o esquema completo (inclusive campos que só serão usados em tarefas futuras:
      mapeamento por soma, obrigatorio, qualitativo, relatório), para o formato ficar estável desde já.
      Depois da validação de esquema, faça a validação semântica contra os SBML: todas as variáveis
      citadas existem; toda variável core tem mapeamento; nomes de métricas existem no registro.
      Mensagens em português, apontando o caminho do campo. Para nomes inexistentes, sugira o mais
      parecido (difflib). Escreva um teste para cada caso de erro. Crie `exemplos/config_exemplo.yaml`
      comentado, que servirá de template para os usuários.

  - id: T07
    titulo: "Mapeamento por soma, soma ponderada e variáveis eliminadas por QSSA"
    tipo: [código]
    marco: M2
    semana: 3
    depende: [T05]
    capacidades: [M2, M3, M4]
    contexto: |
      É o que diferencia a biblioteca de um script: comparar modelos com variáveis diferentes. A
      simplificação 2 da Verly junta os macrófagos M0, M1 e M2 numa variável M, e isso só pode ser
      verificado com mapeamento por soma.
    entrega: |
      É possível verificar simplificações por agregação (lumping) e por eliminação via QSSA.
    aceite:
      - "Sintaxe de lista `[A, B]` = soma; sintaxe de dicionário `{A: 1.0, B: 0.5}` = soma ponderada"
      - "Variáveis definidas por assignment rule no SBML podem ser usadas no mapeamento"
      - "Campo `core: true` e palavra-chave `variaveis: core` nos critérios funcionando"
      - "Teste com o par de brinquedo 3 (agregação) aprovado"
      - "Teste com o par 1 comparando a variável eliminada (assignment rule) com a original"
    instrucao: |
      Estenda o módulo de mapeamento. Leia o CLAUDE.md antes.
      1. Suporte três formas no campo `original` (e também em `simplificado`): string (1:1), lista
         (soma) e dicionário nome→peso (soma ponderada). Normalize tudo internamente para dicionário
         nome→peso.
      2. Garanta que a simulação exporte também as variáveis definidas por assignment rule (no
         libRoadRunner, ajuste as `timeCourseSelections`).
      3. Implemente `core: true` por variável e o seletor `variaveis: core` nos critérios.
      4. Testes com os pares de brinquedo 1 e 3.
      Fora do escopo: expressões arbitrárias (razões, funções). Se o YAML trouxer algo assim, a
      validação deve recusar com mensagem dizendo que não é suportado.

  - id: T08
    titulo: "Métricas plugáveis: MAPE protegido, erro máximo e erro no estado estacionário"
    tipo: [código]
    marco: M2
    semana: 3
    depende: [T05]
    capacidades: [Q2, Q3, Q4, Q5]
    contexto: |
      "O usuário escolhe a métrica" é uma promessa central do produto. O registro plugável também é o
      que permite dizer, no texto, que a biblioteca é extensível. O MAPE atual do TCC I explode quando a
      variável original se aproxima de zero, e isso precisa ser tratado.
    entrega: |
      Quatro métricas prontas e um jeito documentado de adicionar outras sem mexer no núcleo.
    aceite:
      - "Registro de métricas por decorador (ex.: `@register_metric(\"nrmse\")`), com NRMSE migrado para ele"
      - "MAPE com proteção: pontos onde |original| < epsilon são excluídos e o número de pontos excluídos é reportado"
      - "Erro máximo absoluto e relativo"
      - "Erro no estado estacionário (compara os valores finais, ou a média da última fração configurável da série)"
      - "Cada métrica devolve: valor, unidade/descrição e avisos"
      - "Teste que registra uma métrica nova num arquivo de teste e a usa via YAML, sem alterar o pacote"
      - "Testes numéricos com valores calculados à mão para cada métrica"
    instrucao: |
      Implemente o registro de métricas e as métricas do MVP. Leia o CLAUDE.md antes.
      1. Crie um registro com decorador; cada métrica recebe (t, y_orig, y_simp, params) e devolve um
         objeto com valor, descrição e lista de avisos.
      2. Migre o NRMSE para o registro.
      3. Implemente: `mape` (com epsilon configurável; exclui pontos perto de zero e avisa quantos),
         `erro_max_abs`, `erro_max_rel`, `erro_estacionario`.
      4. Opcional nesta tarefa, se for rápido: `erro_simetrico` de Frøysa et al. (2018); cite a fonte na docstring.
      5. Teste de extensibilidade: registre uma métrica nova só no arquivo de teste e use-a pelo YAML.
      Escreva as fórmulas nas docstrings: elas vão para o texto do TCC.

  - id: T09
    titulo: "Condições de simulação: sobrescrever parâmetros, medir ruído numérico e detectar falhas"
    tipo: [código]
    marco: M2
    semana: 4
    depende: [T05]
    capacidades: [S2, S3, S4]
    contexto: |
      Parte da diferença entre dois modelos pode vir do solver, não da simplificação. Medir esse
      "ruído de fundo" dá um piso honesto para os limites. Também é preciso detectar simulações que
      divergem, em vez de gerar métricas sem sentido.
    entrega: |
      Comparações confiáveis: o relatório diz quanto do erro é numérico, e simulações quebradas não geram veredito falso.
    aceite:
      - "YAML permite sobrescrever condições iniciais e parâmetros, por modelo ou para os dois"
      - "Ruído numérico: o original é simulado de novo com tolerâncias 100x mais frouxas e a diferença entra no relatório"
      - "Aviso quando algum limite de critério é menor que 10x o ruído numérico"
      - "Simulação que falha, gera NaN/Inf ou valores negativos em variável não negativa vira erro claro, não veredito"
      - "Testes para cada caso"
    instrucao: |
      Estenda o módulo de simulação. Leia o CLAUDE.md antes.
      1. Suporte `simulacao.sobrescrever` no YAML: {parametros: {...}, condicoes_iniciais: {...}},
         aplicado aos dois modelos (ou por modelo, com as chaves `original` e `simplificado`).
      2. Ruído numérico: simule o original de novo com rtol e atol 100x maiores e calcule o NRMSE entre
         as duas execuções. Guarde no resultado como `ruido_numerico`.
      3. Aviso quando um limite de critério for menor que 10x esse ruído.
      4. Falhas: capture exceções do solver, NaN/Inf e valores negativos (opção `nao_negativas: true`,
         padrão true) e gere um erro de simulação claro, com tempo e variável do problema.
      Não mexa nas métricas nem no veredito.

  - id: T10
    titulo: "Veredito em três níveis com porcentagem e critérios obrigatórios"
    tipo: [código]
    marco: M2
    semana: 4
    depende: [T05, T08]
    capacidades: [V2]
    contexto: |
      A regra do veredito é o coração do produto. Uma porcentagem sozinha pode esconder uma falha grave
      (90% aprovado, mas a variável principal falhou). Por isso existem critérios obrigatórios.
    entrega: |
      O veredito final segue a regra do documento de produto (`docs/produto.md`) e nunca aprova com um critério obrigatório falhando.
    aceite:
      - "Cada par (critério, variável) conta como um item na porcentagem"
      - "REPROVADO se qualquer item obrigatório falhar; APROVADO COM RESSALVAS se só desejáveis falharem; APROVADO se todos passarem"
      - "Resultado traz contagens separadas: obrigatórios passados/total, desejáveis passados/total"
      - "Se D01 decidir só dois níveis, uma opção de configuração desliga o nível intermediário"
      - "Testes cobrindo os três vereditos e o caso \"porcentagem alta mas reprovado\""
    instrucao: |
      Implemente a regra do veredito descrita na seção "Output" do documento de produto (`docs/produto.md`). Leia o
      CLAUDE.md antes.
      Cada item é um par (critério, variável). Campo `obrigatorio` por critério (padrão: true).
      Veredito: REPROVADO se algum obrigatório falhar; APROVADO COM RESSALVAS se todos os obrigatórios
      passarem e algum desejável falhar; APROVADO se tudo passar. Porcentagem = itens aprovados / total.
      Inclua a opção `relatorio.niveis: 2` que transforma "com ressalvas" em APROVADO (confira com a
      Isabella qual padrão ela decidiu em D01).
      Teste explicitamente: 9 de 10 itens passando, com o que falha sendo obrigatório → REPROVADO.

  - id: T11
    titulo: "Relatório legível em HTML com tabela, razões e gráficos"
    tipo: [código]
    marco: M2
    semana: 4
    depende: [T10]
    capacidades: [R2, R3]
    contexto: |
      O relatório é o que a orientadora, a banca e os usuários vão ver. O JSON serve às máquinas; o
      HTML precisa convencer uma pessoa em 30 segundos (veredito no topo, depois o detalhe).
    entrega: |
      Um relatório que se entende sem abrir o código, com os gráficos que vão para o texto do TCC.
    aceite:
      - "HTML autocontido (imagens embutidas) gerado com um template Jinja2"
      - "Topo: veredito, porcentagem, contagem de obrigatórios e desejáveis"
      - "Tabela: critério, variável, valor, limite, tipo, resultado"
      - "Seções de razões e avisos (preenchidas com o que já existir; T15 detalha as razões)"
