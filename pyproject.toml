[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "reducheck"
version = "0.1.0.dev0"
description = "Verifica se um modelo de EDOs simplificado é fiel ao original"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Isabella Mourão Dias", email = "isabellamouraodias@gmail.com" }]
keywords = ["sbml", "ode", "model-reduction", "verification"]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "libroadrunner>=2.7",
    "numpy>=1.26",
    "scipy>=1.11",
    "pyyaml>=6.0",
    "pydantic>=2.6",
    "matplotlib>=3.8",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[project.urls]
Repository = "https://github.com/isasmourao/tcc-reducheck"

[tool.hatch.build.targets.wheel]
packages = ["src/reducheck"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "D"]
ignore = ["D203", "D213"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]
# Script de planejamento, fora da biblioteca: isento de estilo e docstrings,
# mas as regras de bug (F, B) continuam valendo.
"planejamento/*" = ["D", "E501", "E741"]

[tool.ruff.lint.pydocstyle]
convention = "pep257"
